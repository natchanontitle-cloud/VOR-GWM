<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B3262E">
<title>GWM-AFS HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B3262E; --red-h:#C9303A; --red-soft:rgba(179,38,46,.08);
  --bg:#F4F4F6; --card:#FFFFFF; --ink:#16181D; --muted:#6E727C; --line:#E7E8EC;
  --shadow:0 1px 2px rgba(16,18,24,.04), 0 10px 30px -18px rgba(16,18,24,.18);
  --chip:#E4F3E8; --chip-ink:#1E7A3C;
}
[data-theme="dark"]{
  --red:#D23A44; --red-h:#E04852; --red-soft:rgba(210,58,68,.14);
  --bg:#14161B; --card:#20232B; --ink:#F3F4F6; --muted:#9AA0AB; --line:#2E323C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.6);
  --chip:#2B2F39; --chip-ink:#E6E8EC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Prompt",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 22px}

/* top bar */
.top{padding:20px 0 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo{width:48px;height:48px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:600;font-size:24px;box-shadow:0 6px 16px -6px rgba(179,38,46,.6);flex:none}
.brand b{display:block;white-space:nowrap;font-size:20px;font-weight:600;letter-spacing:.3px;line-height:1.15}
.brand small{display:block;font-size:11.5px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ctrls{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);letter-spacing:.5px}
.seg button.on{background:var(--red);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

main{flex:1}
/* hero */
.hero{padding:9vh 0 5vh}
.hero h1{margin:0;font-weight:600;font-size:clamp(40px,7vw,68px);line-height:1.08;letter-spacing:-.5px}
.hero h1 .r{color:var(--red);display:block}
.hero p{margin:18px 0 0;color:var(--muted);font-size:clamp(15px,2vw,18px);font-weight:300;max-width:560px}

.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:7vh}
.door{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 26px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s, box-shadow .25s, border-color .25s}
.door:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--red) 30%, var(--line))}
.door .di{width:46px;height:46px;border-radius:13px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.door .di svg{width:24px;height:24px}
.door h2{margin:18px 0 4px;font-size:26px;font-weight:600}
.door p{margin:0;color:var(--muted);font-weight:300;font-size:15px;flex:1}
.door .meta{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.door .meta svg{width:13px;height:13px}
.enter{margin-top:20px;border:0;background:var(--red);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;font-size:15px;letter-spacing:1.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s, transform .1s}
.enter:hover{background:var(--red-h)}
.enter:active{transform:scale(.98)}

/* module page */
.phead{padding:6vh 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--red)}
.phead h1{margin:0;font-size:clamp(32px,5vw,46px);font-weight:600;letter-spacing:-.3px}
.phead h1 span{color:var(--red)}
.phead .sub{color:var(--muted);font-weight:300;margin-top:4px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--red);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding-bottom:8vh}
.mod{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;box-shadow:var(--shadow);min-height:180px;transition:transform .25s,border-color .25s}
a.mod:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--red) 35%, var(--line))}
.mod .mi{width:44px;height:44px;border-radius:13px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.mod .mi svg{width:22px;height:22px}
.mod .tag{position:absolute;right:20px;top:22px;font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-weight:500}
.mod h3{margin:16px 0 2px;font-size:21px;font-weight:600}
.mod p{margin:0;color:var(--muted);font-size:14px;font-weight:300;line-height:1.55;flex:1}
.mod .go{margin-top:14px;display:flex;align-items:center;justify-content:space-between;color:var(--red);font-weight:500;font-size:14px;letter-spacing:.5px}
.mod .go i{font-style:normal;transition:transform .25s}
a.mod:hover .go i{transform:translateX(4px)}

/* lock */
.mask{position:fixed;inset:0;background:color-mix(in srgb, var(--bg) 70%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.mask.on{display:flex}
.lock{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 26px 24px;box-shadow:0 30px 70px -30px rgba(0,0,0,.4)}
.lock .di{width:52px;height:52px;border-radius:15px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin-bottom:16px}
.lock .di svg{width:26px;height:26px}
.lock h2{margin:0 0 4px;font-size:24px;font-weight:600}
.lock p{margin:0 0 18px;color:var(--muted);font-weight:300;font-size:14px}
.pwbox{position:relative}
.pwbox input{width:100%;font:inherit;font-size:16px;padding:13px 46px 13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.pwbox input:focus{border-color:var(--red)}
.pwbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:8px;display:grid}
.pwbox svg{width:18px;height:18px}
.rem{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13.5px;color:var(--muted);cursor:pointer}
.rem input{accent-color:var(--red);width:16px;height:16px}
.err{color:var(--red);font-size:13.5px;margin-top:10px;display:none}
.lock .row{display:flex;gap:10px;margin-top:18px}
.lock .row .enter{flex:1;margin:0}
.lock .row .ghost{border-radius:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

footer{padding:18px 0 26px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
/* admin */
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:4vh 14px;overflow:auto}
.sheet.on{display:flex}
.panel{width:min(720px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 70px -30px rgba(0,0,0,.45)}
.panel h2{margin:0 0 4px;font-size:22px;font-weight:600}
.panel .hint{color:var(--muted);font-size:13.5px;font-weight:300;margin:0 0 16px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.mrow .mi{width:34px;height:34px;border-radius:10px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.mrow .mi svg{width:17px;height:17px}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small{color:var(--muted);font-size:12px}
.mrow .acts{display:flex;gap:4px}
.sq{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.sq:hover{border-color:var(--red);color:var(--red)}
.sq:disabled{opacity:.35;cursor:default}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input[type=text],.form input[type=url],.form input[type=password],.form select{font:inherit;font-size:15px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.form input:focus,.form select:focus{border-color:var(--red)}
.chk{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink)!important;font-size:14px!important}
.chk span{display:inline-flex;gap:6px;align-items:center}
.chk input{accent-color:var(--red);width:16px;height:16px}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.icons button svg{width:19px;height:19px}
.icons button.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.bar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.bar .r{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;padding:10px 14px;border-radius:12px}
.enter.small{margin:0;letter-spacing:.5px}
details.gh{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.gh summary{cursor:pointer;font-weight:500;font-size:14px}
details.gh ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.7}
.msg{font-size:13.5px;margin-top:10px;color:var(--muted)}
.msg.ok{color:#1E7A3C}.msg.bad{color:var(--red)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90vw}
@media (max-width:560px){.form{grid-template-columns:1fr}}
/* manuals */
.bookbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
.bookbtn:hover{border-color:var(--red);color:var(--red)}
.bookbtn svg{width:16px;height:16px}
.mod .go .howto{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:auto;margin-left:10px;letter-spacing:0;background:var(--card)}
.mod .go .howto:hover{color:var(--red);border-color:var(--red)}
.mgroup{margin-bottom:26px}
.mgroup h3{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--muted);letter-spacing:.3px}
.mangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.man{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s,transform .2s;font:inherit;color:inherit}
.man:hover{border-color:color-mix(in srgb, var(--red) 35%, var(--line));transform:translateY(-2px)}
.man .mi{width:42px;height:42px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.man .mi svg{width:21px;height:21px}
.man b{display:block;font-weight:500;font-size:15px;line-height:1.35}
.man small{color:var(--muted);font-size:12px}
.new{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.5px;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 22px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.vbar b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.vbody iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.vbody .imgwrap{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.vbody img{max-width:100%;height:auto;cursor:zoom-in;border-radius:6px;box-shadow:var(--shadow)}
.vbody img.zoom{max-width:none;cursor:zoom-out}
.vnote{padding:8px 14px;font-size:13px;color:var(--muted);background:var(--card);border-top:1px solid var(--line)}
.tabs2{display:flex;gap:6px;margin:0 0 16px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content}
.tabs2 button{font:inherit;font-size:14px;border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.filebox{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;background:var(--bg)}
.filebox:hover{border-color:var(--red);color:var(--red)}
.filebox b{color:var(--ink)}
.hide{display:none!important}
@media (max-width:640px){
  .bookbtn span{display:none}
  .bookbtn{padding:0;width:38px;justify-content:center}
  .doors{grid-template-columns:1fr}
  .brand small{display:none}
  .brand b{font-size:17px}
  .logo{width:42px;height:42px;font-size:21px}
  .hero{padding-top:6vh}
}
@media (max-width:380px){ .ctrls .seg button{padding:6px 9px} }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <button class="brand" id="home"><div class="logo">G</div><div><b>GWM-AFS HUB</b><small data-t="tagline"></small></div></button>
  <div class="ctrls">
    <button class="bookbtn" id="btnMan" aria-label="Manual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg><span data-t="manuals"></span></button>
    <div class="seg" id="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div>
    <button class="iconbtn" id="theme" aria-label="Day / Night"></button>
  </div>
</div></div>

<main>
  <section id="vHome" class="wrap">
    <div class="hero">
      <h1><span data-t="hero1"></span><span class="r" data-t="hero2"></span></h1>
      <p data-t="heroSub"></p>
    </div>
    <div class="doors">
      <div class="door">
        <div class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg></div>
        <h2>GWM Partner</h2>
        <p data-t="partnerDesc"></p>
        <div class="meta" id="pCount"></div>
        <button class="enter" data-go="partner"><span data-t="enter"></span> →</button>
      </div>
      <div class="door">
        <div class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
        <h2>GWM RSM</h2>
        <p data-t="rsmDesc"></p>
        <div class="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-t="needPw"></span></div>
        <button class="enter" data-go="rsm"><span data-t="enter"></span> →</button>
      </div>
    </div>
  </section>

  <section id="vMods" class="wrap hide">
    <div class="phead">
      <div>
        <button class="back" id="back">← <span data-t="backHome"></span></button>
        <h1 id="pTitle"></h1>
        <div class="sub" id="pSub"></div>
      </div>
      <div class="pbtns"><button class="ghost hide" id="manage"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="manage"></span></button>
      <button class="ghost hide" id="logout"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span data-t="logout"></span></button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="vMan" class="wrap hide">
    <div class="phead">
      <div>
        <button class="back" id="manBack">← <span data-t="back"></span></button>
        <h1 data-t="manTitle"></h1>
        <div class="sub" data-t="manSub"></div>
      </div>
      <div class="pbtns"><button class="ghost hide" id="manManage">＋ <span data-t="manManage"></span></button></div>
    </div>
    <div class="chips" id="manChips"></div>
    <div id="manList" style="padding-bottom:8vh"></div>
  </section>
</main>

<footer><div class="wrap"><span>© 2026 GWM-AFS HUB</span><span>by Natchanon C.</span></div></footer>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer">
  <div class="vbar"><button class="ghost small" id="vClose">← <span data-t="back"></span></button><b id="vTitle"></b><a class="ghost small" id="vOpen" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span data-t="openTab"></span> ↗</a></div>
  <div class="vbody" id="vBody"></div>
  <div class="vnote hide" id="vNote" data-t="pdfNote"></div>
</div>
<div class="mask" id="mask">
  <form class="lock" id="lockForm" autocomplete="on">
    <div class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h2>GWM RSM</h2>
    <p data-t="lockSub"></p>
    <input type="text" name="username" value="rsm" autocomplete="username" hidden>
    <div class="pwbox">
      <input type="password" id="pw" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="button" id="eye" aria-label="show"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="rem"><input type="checkbox" id="rem"><span data-t="remember"></span></label>
    <div class="err" id="err" data-t="wrongPw"></div>
    <div class="row"><button type="button" class="ghost" id="cancel" data-t="cancel"></button><button type="submit" class="enter"><span data-t="enter"></span> →</button></div>
  </form>
</div>

<script>
/* =====================================================================
   เมนูถูกเก็บในไฟล์ modules.json (อยู่ข้างไฟล์นี้ใน repo)
   แก้ผ่านหน้าเว็บได้: เข้า GWM RSM → ปุ่ม "จัดการเมนู"
   DEFAULT_MODULES ข้างล่างใช้เฉพาะตอนยังไม่มี modules.json
   ===================================================================== */
const DEFAULT_MODULES = [
  { name_th:"VOR", name_en:"VOR", desc_th:"Pending RO · รถค้างซ่อม / รออะไหล่", desc_en:"Pending RO · vehicles off road", url:"https://natchanontitle-cloud.github.io/VOR-GWM/", icon:"vor", roles:["partner","rsm"] },
  { name_th:"ตารางนัดหมาย", name_en:"CRM Appointment", desc_th:"ตรวจ slot นัดหมายให้ตรงมาตรฐาน", desc_en:"Check appointment slots vs. standard", url:"https://natchanontitle-cloud.github.io/GWMtimeslot/", icon:"crm", roles:["partner","rsm"] },
  { name_th:"CSI", name_en:"CSI", desc_th:"ความพึงพอใจลูกค้า", desc_en:"Customer satisfaction", url:"https://natchanontitle-cloud.github.io/CSI-GWMPS/", icon:"csi", roles:["partner","rsm"] },
  { name_th:"7 Days", name_en:"7 Days", desc_th:"ติดตามงาน 7 วัน", desc_en:"7-day follow-up", url:"https://natchanontitle-cloud.github.io/7days/", icon:"days", roles:["rsm"] },
  { name_th:"BG", name_en:"BG", desc_th:"เอกสาร BG", desc_en:"BG documents", url:"https://symphonious-queijadas-48c85d.netlify.app/", icon:"bg", roles:["rsm"] },
  { name_th:"Expense Claim", name_en:"Expense Claim", desc_th:"เบิกค่าใช้จ่าย", desc_en:"Expense claim", url:"https://natchanontitle-cloud.github.io/GWM-expense/", icon:"expense", roles:["rsm"] }
];

/* RSM password — stored as SHA-256 hash only.
   To change: open browser console and run  sha('new-password')  then paste the result here. */
const RSM_HASH = "b40d417bbd958de90a54ff1141839977fe25e5d0825a045befa047320f216f7e";

/* Where "Save to web" writes modules.json (GitHub repo of this hub) */
const GH_DEFAULT = { owner:"natchanontitle-cloud", repo:"AFS-HUB", branch:"main", path:"modules.json" };

const T = {
  th:{ tagline:"After-Sales Management", hero1:"ศูนย์รวมเครื่องมือ", hero2:"Aftersales - RSM", heroSub:"พื้นที่ทำงานกลางสำหรับงานบริการหลังการขาย GWM",
       partnerDesc:"สำหรับศูนย์บริการ (PS)", rsmDesc:"สำหรับ Regional Service Manager", needPw:"ต้องใส่รหัสผ่าน", enter:"เข้าสู่ระบบ", tools:n=>`${n} เครื่องมือ`,
       backHome:"หน้าแรก", logout:"ออกจากระบบ", manage:"จัดการเมนู", lockSub:"ใส่รหัสผ่าน RSM เพื่อเข้าใช้งาน", remember:"จำรหัสในเครื่องนี้", wrongPw:"รหัสผ่านไม่ถูกต้อง",
       cancel:"ยกเลิก", open:"เปิดใช้งาน", manuals:"คู่มือ", howto:"วิธีใช้", manTitle:"คู่มือการใช้งาน", manSub:"วิธีใช้เครื่องมือแต่ละตัว — กดเพื่อเปิดอ่าน", manManage:"จัดการคู่มือ", back:"กลับ", all:"ทั้งหมด", general:"ทั่วไป", new:"ใหม่", noManual:"ยังไม่มีคู่มือ", openTab:"เปิดแท็บใหม่", pdfNote:"ถ้า PDF ไม่แสดงในมือถือ กด \"เปิดแท็บใหม่\" ด้านบน", soon:"เร็ว ๆ นี้", ready:n=>`${n} เครื่องมือพร้อมใช้งาน`, partnerWs:"Partner workspace", rsmWs:"Management workspace", both:"PS + RSM", rsmOnly:"RSM" },
  en:{ tagline:"After-Sales Management", hero1:"One Hub", hero2:"for AFS tools", heroSub:"Your central workspace for GWM after-sales operations.",
       partnerDesc:"Partner workspace for service centers", rsmDesc:"Management workspace for RSMs", needPw:"Password required", enter:"ENTER", tools:n=>`${n} tools`,
       backHome:"Home", logout:"Log out", manage:"Manage menu", lockSub:"Enter the RSM password to continue", remember:"Remember on this device", wrongPw:"Incorrect password",
       cancel:"Cancel", open:"Open", manuals:"Manuals", howto:"How-to", manTitle:"User manuals", manSub:"How to use each tool — tap to open", manManage:"Manage manuals", back:"Back", all:"All", general:"General", new:"NEW", noManual:"No manuals yet", openTab:"Open in new tab", pdfNote:"If the PDF does not show on mobile, tap \"Open in new tab\" above", soon:"Coming soon", ready:n=>`${n} tools available`, partnerWs:"Partner workspace", rsmWs:"Management workspace", both:"PS + RSM", rsmOnly:"RSM" }
};
const ICONS = {
  vor:'<path d="M5 17h14M6 17l1.5-5h9L18 17M7 12l1.2-4h7.6L17 12"/><circle cx="8" cy="17.5" r="1.6"/><circle cx="16" cy="17.5" r="1.6"/>',
  crm:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M9 3v4M15 3v4M8 13.5h3M8 16.5h6"/>',
  csi:'<path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.3L12 16.3 7.2 18.8l.9-5.3L4.2 9.7l5.4-.8z"/>',
  days:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
  bg:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  expense:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  parts:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/>',
  book:'<path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const svg = (k, w = 1.7) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.link}</svg>`;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try { return sessionStorage.getItem(k) ?? localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v, keep = true){ try { keep ? localStorage.setItem(k, v) : sessionStorage.setItem(k, v); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch(e){} }
};
function toast(m, ms = 2800){ const x = $("toast"); x.textContent = m; x.style.display = "block"; clearTimeout(x._h); x._h = setTimeout(() => x.style.display = "none", ms); }

let MODULES = DEFAULT_MODULES.map(m => ({...m}));
let lang = store.get("afsLang") || "th";
let theme = store.get("afsTheme") || "light";
let view = "home";
const t = (k, ...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };
const nm = m => (lang === "en" ? m.name_en : m.name_th) || m.name_th || m.name_en || "";
const ds = m => (lang === "en" ? m.desc_en : m.desc_th) || m.desc_th || m.desc_en || "";

function normalize(list){
  return (Array.isArray(list) ? list : []).map(m => ({
    name_th: String(m.name_th ?? m.name ?? "").trim(), name_en: String(m.name_en ?? m.name ?? "").trim(),
    desc_th: String(m.desc_th ?? m.th ?? "").trim(), desc_en: String(m.desc_en ?? m.en ?? "").trim(),
    url: String(m.url ?? "").trim(), icon: ICONS[m.icon] ? m.icon : "link",
    roles: (Array.isArray(m.roles) ? m.roles : ["rsm"]).filter(r => r === "partner" || r === "rsm")
  })).filter(m => m.name_th || m.name_en);
}
async function loadModules(){
  try {
    const r = await fetch("modules.json?v=" + Date.now(), {cache:"no-store"});
    if (r.ok){ const j = await r.json(); const list = normalize(j.modules || j); if (list.length) MODULES = list; }
  } catch(e){ /* no modules.json yet → use DEFAULT_MODULES */ }
  applyLang();
}

function applyTheme(){ document.documentElement.dataset.theme = theme; $("theme").innerHTML = theme === "dark" ? SUN : MOON; }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("pw").placeholder = lang === "th" ? "รหัสผ่าน" : "Password";
  $("pCount").textContent = t("tools", MODULES.filter(m => m.roles.includes("partner")).length);
  render();
}
function render(){
  $("vHome").classList.toggle("hide", view !== "home");
  $("vMods").classList.toggle("hide", view !== "partner" && view !== "rsm");
  $("vMan").classList.toggle("hide", view !== "manuals");
  if (view === "manuals"){ $("manManage").classList.toggle("hide", !canRsm()); renderManuals(); return; }
  if (view === "home") return;
  const isR = view === "rsm";
  $("pTitle").innerHTML = isR ? "GWM <span>RSM</span>" : "GWM <span>Partner</span>";
  const list = MODULES.filter(m => m.roles.includes(view));
  $("pSub").textContent = `${isR ? t("rsmWs") : t("partnerWs")} · ${t("ready", list.filter(m => m.url).length)}`;
  $("logout").classList.toggle("hide", !isR);
  $("manage").classList.toggle("hide", !isR);
  $("grid").innerHTML = list.map(m => {
    const tag = isR ? `<span class="tag">${m.roles.includes("partner") ? t("both") : t("rsmOnly")}</span>` : "";
    const body = `<div class="mi">${svg(m.icon)}</div>${tag}<h3>${esc(nm(m))}</h3><p>${esc(ds(m))}</p>`;
    return m.url
      ? `<a class="mod" href="${esc(m.url)}" target="_blank" rel="noopener">${body}<div class="go"><span>${t("open")}</span>${manualsFor(modKey(m)).length ? `<span class="howto" data-howto="${esc(modKey(m))}">📘 ${t("howto")}</span>` : ""}<i>→</i></div></a>`
      : `<div class="mod" style="opacity:.6">${body}<div class="go" style="color:var(--muted)"><span>${t("soon")}</span></div></div>`;
  }).join("") || `<p style="color:var(--muted)">—</p>`;
}
let lastView = "home";
function go(v){
  if (v === "rsm" && store.get("afsRsm") !== "1"){ openLock(); return; }
  if (v === "manuals" && view !== "manuals") lastView = view;
  view = v; render(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", v === "home" ? location.pathname + location.search : "#" + v); } catch(e){}
}

/* ---------- lock ---------- */
async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
window.sha = sha;
function openLock(){ $("err").style.display = "none"; $("pw").value = ""; $("mask").classList.add("on"); setTimeout(() => $("pw").focus(), 60); }
function closeLock(){ $("mask").classList.remove("on"); }
$("lockForm").onsubmit = async e => {
  e.preventDefault();
  const raw = $("pw").value;
  const tries = [...new Set([raw, raw.trim(), raw.trim().toLowerCase()])].filter(Boolean);
  let ok = false;
  for (const x of tries){ if (await sha(x) === RSM_HASH){ ok = true; break; } }
  if (!ok){ $("err").style.display = "block"; const f = $("lockForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); $("pw").select(); return; }
  store.set("afsRsm", "1", $("rem").checked);
  closeLock(); go("rsm");
};
$("eye").onclick = () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; };
$("cancel").onclick = closeLock;
$("mask").onclick = e => { if (e.target.id === "mask") closeLock(); };

/* ---------- manuals (คู่มือ) ---------- */
let MANUALS = [];
let manFilter = "__all";
const BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h7z"/></svg>';
const KIND_ICON = {
  html:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 13l-2 2 2 2M15 13l2 2-2 2"/>',
  pdf:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
  link:ICONS.link
};
const KIND_LABEL = {html:"คู่มือ", pdf:"PDF", image:"รูป", link:"ลิงก์"};
const kindOf = s => { const x = String(s || "").toLowerCase().split("?")[0];
  if (/\.(png|jpe?g|webp|gif|svg)$/.test(x)) return "image"; if (/\.pdf$/.test(x)) return "pdf"; if (/\.html?$/.test(x)) return "html"; return "link"; };
const mt = m => (lang === "en" ? m.title_en : m.title_th) || m.title_th || m.title_en || "";
const isNew = m => m.added && (Date.now() - new Date(m.added).getTime()) < 14 * 864e5;
const canRsm = () => store.get("afsRsm") === "1";
const visibleManuals = () => MANUALS.filter(m => m.roles.includes("partner") || (canRsm() && m.roles.includes("rsm")));
const modKey = m => m.name_th || m.name_en || "";
const manualsFor = mod => visibleManuals().filter(x => x.module === mod);
function normManuals(list){
  return (Array.isArray(list) ? list : []).map(m => ({
    title_th:String(m.title_th || "").trim(), title_en:String(m.title_en || "").trim(), module:String(m.module || ""),
    src:String(m.src || "").trim(), kind:m.kind || kindOf(m.src), added:m.added || "",
    roles:(Array.isArray(m.roles) ? m.roles : ["partner","rsm"]).filter(r => r === "partner" || r === "rsm")
  })).filter(m => (m.title_th || m.title_en) && m.src);
}
async function loadManuals(){
  try { const r = await fetch("manuals.json?v=" + Date.now(), {cache:"no-store"}); if (r.ok){ const j = await r.json(); MANUALS = normManuals(j.manuals || j); } } catch(e){}
  applyLang();
}
function manCard(m, i){
  return `<button class="man" data-man="${i}"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${KIND_ICON[m.kind] || KIND_ICON.link}</svg></div>
    <div><b>${esc(mt(m))}${isNew(m) ? `<span class="new">${t("new")}</span>` : ""}</b><small>${esc(KIND_LABEL[m.kind] || "")}${m.module ? " · " + esc(modName(m.module)) : ""}</small></div></button>`;
}
const modName = key => { const m = MODULES.find(x => modKey(x) === key); return m ? nm(m) : key; };
function renderManuals(){
  const list = visibleManuals();
  const mods = [...new Set(list.map(m => m.module))];
  if (manFilter !== "__all" && !mods.includes(manFilter)) manFilter = "__all";
  $("manChips").innerHTML = mods.length > 1 ? [`<button data-mf="__all" class="${manFilter === "__all" ? "on" : ""}">${t("all")}</button>`, ...mods.map(k => `<button data-mf="${esc(k)}" class="${manFilter === k ? "on" : ""}">${esc(k ? modName(k) : t("general"))}</button>`)].join("") : "";
  const shown = list.filter(m => manFilter === "__all" || m.module === manFilter);
  const order = [...MODULES.map(modKey), ""];
  const groups = [...new Set(shown.map(m => m.module))].sort((a,b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  $("manList").innerHTML = groups.map(g => `<div class="mgroup"><h3>${esc(g ? modName(g) : t("general"))}</h3><div class="mangrid">${shown.filter(m => m.module === g).map(m => manCard(m, MANUALS.indexOf(m))).join("")}</div></div>`).join("")
    || `<p style="color:var(--muted)">${t("noManual")}</p>`;
}
function openManual(m){
  if (m.kind === "link"){ window.open(m.src, "_blank", "noopener"); return; }
  $("vTitle").textContent = mt(m);
  $("vOpen").href = m.src;
  const b = $("vBody");
  if (m.kind === "image") b.innerHTML = `<div class="imgwrap"><img src="${esc(m.src)}" alt="${esc(mt(m))}"></div>`;
  else b.innerHTML = `<iframe src="${esc(m.src)}" title="${esc(mt(m))}"></iframe>`;
  $("vNote").classList.toggle("hide", m.kind !== "pdf");
  $("viewer").classList.add("on"); document.body.style.overflow = "hidden";
}
function closeViewer(){ $("viewer").classList.remove("on"); $("vBody").innerHTML = ""; document.body.style.overflow = ""; }
$("vClose").onclick = closeViewer;
$("vBody").addEventListener("click", e => { if (e.target.tagName === "IMG") e.target.classList.toggle("zoom"); });
$("manList").addEventListener("click", e => { const b = e.target.closest("[data-man]"); if (b) openManual(MANUALS[+b.dataset.man]); });
$("manChips").addEventListener("click", e => { const b = e.target.closest("[data-mf]"); if (b){ manFilter = b.dataset.mf; renderManuals(); } });
$("grid").addEventListener("click", e => {
  const h = e.target.closest("[data-howto]"); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const list = manualsFor(h.dataset.howto);
  if (list.length === 1) openManual(list[0]); else { manFilter = h.dataset.howto; go("manuals"); }
});
$("btnMan").onclick = () => { manFilter = "__all"; go("manuals"); };
$("manBack").onclick = () => go(lastView || "home");

/* ---------- manager (RSM only): menus + manuals ---------- */
let draft = null, mdraft = null, editIdx = null, dirty = false, mtab = "menu", pendingDel = [];
const sheet = $("sheet"), panel = $("panel");
function openManager(tab){
  draft = MODULES.map(m => ({...m, roles:[...m.roles]}));
  mdraft = MANUALS.map(m => ({...m, roles:[...m.roles]}));
  pendingDel = []; dirty = false; mtab = tab || "menu"; drawList(); sheet.classList.add("on");
}
function closeManager(){
  if (dirty && !window.__confirmClose){ window.__confirmClose = true; toast("ยังไม่ได้บันทึก — กดปิดอีกครั้งเพื่อทิ้งการแก้ไข"); setTimeout(() => window.__confirmClose = false, 3000); return; }
  window.__confirmClose = false; sheet.classList.remove("on");
}
function ghBlock(){
  const gh = ghCfg();
  return `<details class="gh" ${gh.token ? "" : "open"}>
      <summary>ตั้งค่าการบันทึกขึ้น GitHub ${gh.token ? "✓" : "(ทำครั้งเดียว)"}</summary>
      <div class="form" style="margin-top:12px">
        <label>GitHub user<input type="text" id="ghOwner" value="${esc(gh.owner)}"></label>
        <label>Repo ของหน้านี้<input type="text" id="ghRepo" value="${esc(gh.repo)}"></label>
        <label class="full">GitHub token (เก็บไว้ในเครื่องนี้เท่านั้น)<input type="password" id="ghTok" value="${esc(gh.token)}" placeholder="github_pat_…" autocomplete="off"></label>
      </div>
      <ol>
        <li>เปิด github.com → รูปโปรไฟล์ → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
        <li>Repository access: เลือก <b>Only select repositories</b> → เลือก repo ของ Hub นี้</li>
        <li>Permissions → Repository → <b>Contents: Read and write</b> → Generate แล้ว copy มาวางช่องด้านบน</li>
      </ol>
    </details>`;
}
const rowActs = (i, n) => `<div class="acts">
  <button class="sq" data-a="up" data-i="${i}" ${i === 0 ? "disabled" : ""} title="ขึ้น">↑</button>
  <button class="sq" data-a="down" data-i="${i}" ${i === n - 1 ? "disabled" : ""} title="ลง">↓</button>
  <button class="sq" data-a="edit" data-i="${i}" title="แก้ไข">✎</button>
  <button class="sq" data-a="del" data-i="${i}" title="ลบ">✕</button></div>`;
function drawList(){
  const tabs = `<div class="tabs2"><button data-a="tab" data-t2="menu" class="${mtab === "menu" ? "on" : ""}">เมนู</button><button data-a="tab" data-t2="man" class="${mtab === "man" ? "on" : ""}">📘 คู่มือ</button></div>`;
  let body;
  if (mtab === "menu"){
    body = `<h2>จัดการเมนู</h2>
      <p class="hint">เพิ่ม แก้ ลบ หรือเลื่อนลำดับกล่อง แล้วกด "บันทึกขึ้นเว็บ" ทุกคนจะเห็นเมนูใหม่ภายใน 1–2 นาที</p>
      <div class="mlist">${draft.map((m, i) => `<div class="mrow"><div class="mi">${svg(m.icon)}</div>
        <div class="tx"><b>${esc(m.name_th || m.name_en)}</b><small>${m.roles.includes("partner") ? "PS + RSM" : "RSM"} · ${m.url ? esc(m.url.replace(/^https?:\/\//, "")) : "เร็ว ๆ นี้"}</small></div>${rowActs(i, draft.length)}</div>`).join("")}</div>
      <button class="ghost small" data-a="add" style="margin-top:12px">＋ เพิ่มเมนูใหม่</button>`;
  } else {
    body = `<h2>จัดการคู่มือ</h2>
      <p class="hint">แนบไฟล์ HTML, PDF หรือรูป (ไม่เกิน 20 MB) หรือใส่ลิงก์ (เช่น YouTube / Google Drive) แล้วกด "บันทึกขึ้นเว็บ"</p>
      <div class="mlist">${mdraft.map((m, i) => `<div class="mrow"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${KIND_ICON[m.kind] || KIND_ICON.link}</svg></div>
        <div class="tx"><b>${esc(m.title_th || m.title_en)}${m._file ? ' <span class="new">รออัปโหลด</span>' : ""}</b><small>${esc(m.module ? modName(m.module) : "ทั่วไป")} · ${m.roles.includes("partner") ? "PS + RSM" : "RSM"} · ${esc(KIND_LABEL[m.kind])}</small></div>${rowActs(i, mdraft.length)}</div>`).join("") || `<p class="hint">ยังไม่มีคู่มือ</p>`}</div>
      <button class="ghost small" data-a="add" style="margin-top:12px">＋ เพิ่มคู่มือ</button>`;
  }
  panel.innerHTML = tabs + body + ghBlock() + `<div class="msg" id="saveMsg"></div>
    <div class="bar"><button class="ghost small" data-a="close">ปิด</button><div class="r">${mtab === "menu" ? `<button class="ghost small" data-a="download">ดาวน์โหลด modules.json</button>` : ""}<button class="enter small" data-a="save">บันทึกขึ้นเว็บ</button></div></div>`;
}
function drawForm(i){
  editIdx = i;
  if (mtab === "man") return drawManForm(i);
  const m = i == null ? {name_th:"", name_en:"", desc_th:"", desc_en:"", url:"", icon:"link", roles:["rsm"]} : draft[i];
  panel.innerHTML = `
    <h2>${i == null ? "เพิ่มเมนูใหม่" : "แก้ไขเมนู"}</h2>
    <p class="hint">ช่องภาษาอังกฤษเว้นว่างได้ จะใช้ภาษาไทยแทน · ลิงก์เว้นว่าง = แสดงเป็น "เร็ว ๆ นี้"</p>
    <div class="form">
      <label>ชื่อ (TH) *<input type="text" id="fNameTh" value="${esc(m.name_th)}" placeholder="เช่น Warranty"></label>
      <label>ชื่อ (EN)<input type="text" id="fNameEn" value="${esc(m.name_en)}"></label>
      <label>คำอธิบาย (TH)<input type="text" id="fDescTh" value="${esc(m.desc_th)}" placeholder="บรรทัดสั้น ๆ ใต้ชื่อ"></label>
      <label>คำอธิบาย (EN)<input type="text" id="fDescEn" value="${esc(m.desc_en)}"></label>
      <label class="full">ลิงก์เว็บ<input type="url" id="fUrl" value="${esc(m.url)}" placeholder="https://…"></label>
      <label class="full">ใครเห็นเมนูนี้
        <div class="chk"><span><input type="checkbox" id="fPartner" ${m.roles.includes("partner") ? "checked" : ""}> GWM Partner (PS)</span><span><input type="checkbox" id="fRsm" ${m.roles.includes("rsm") ? "checked" : ""}> GWM RSM</span></div>
      </label>
      <label class="full">ไอคอน<div class="icons" id="fIcons">${Object.keys(ICONS).map(k => `<button type="button" data-ic="${k}" class="${k === m.icon ? "on" : ""}">${svg(k)}</button>`).join("")}</div></label>
    </div>
    <div class="msg bad" id="formMsg"></div>
    <div class="bar"><button class="ghost small" data-a="back">← กลับ</button><button class="enter small" data-a="apply">ตกลง</button></div>`;
}
let formFile = null;
function drawManForm(i){
  const m = i == null ? {title_th:"", title_en:"", module:"", src:"", kind:"html", roles:["partner","rsm"]} : mdraft[i];
  formFile = m._file || null;
  const isUrl = /^https?:\/\//i.test(m.src);
  panel.innerHTML = `
    <h2>${i == null ? "เพิ่มคู่มือ" : "แก้ไขคู่มือ"}</h2>
    <p class="hint">เลือกไฟล์จากเครื่อง หรือใส่ลิงก์อย่างใดอย่างหนึ่ง</p>
    <div class="form">
      <label>ชื่อคู่มือ (TH) *<input type="text" id="fTTh" value="${esc(m.title_th)}" placeholder="เช่น วิธีใช้ตารางนัดหมาย"></label>
      <label>ชื่อคู่มือ (EN)<input type="text" id="fTEn" value="${esc(m.title_en)}"></label>
      <label class="full">ของเมนู<select id="fMod"><option value="">ทั่วไป (ไม่ผูกกับเมนู)</option>${MODULES.map(x => `<option value="${esc(modKey(x))}" ${modKey(x) === m.module ? "selected" : ""}>${esc(modKey(x))}</option>`).join("")}</select></label>
      <label class="full">ไฟล์ (HTML / PDF / รูป)
        <div class="filebox" id="fBox">${formFile ? `<b>${esc(formFile.name)}</b> · ${(formFile.size/1024).toFixed(0)} KB — แตะเพื่อเปลี่ยน` : (m.src && !isUrl ? `ไฟล์ปัจจุบัน: <b>${esc(m.src.split("/").pop())}</b> — แตะเพื่อเปลี่ยนเป็นไฟล์ใหม่` : "แตะเพื่อเลือกไฟล์")}</div>
        <input type="file" id="fFile" accept=".html,.htm,.pdf,image/*" hidden>
      </label>
      <label class="full">หรือ ลิงก์<input type="url" id="fLink" value="${isUrl ? esc(m.src) : ""}" placeholder="https://… (YouTube, Google Drive ฯลฯ)"></label>
      <label class="full">ใครเห็นคู่มือนี้
        <div class="chk"><span><input type="checkbox" id="fP" ${m.roles.includes("partner") ? "checked" : ""}> GWM Partner (PS)</span><span><input type="checkbox" id="fR" ${m.roles.includes("rsm") ? "checked" : ""}> GWM RSM</span></div>
      </label>
    </div>
    <div class="msg bad" id="formMsg"></div>
    <div class="bar"><button class="ghost small" data-a="back">← กลับ</button><button class="enter small" data-a="apply">ตกลง</button></div>`;
  $("fBox").onclick = () => $("fFile").click();
  $("fFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024){ $("formMsg").textContent = "ไฟล์ใหญ่เกิน 20 MB — ใส่เป็นลิงก์แทน"; return; }
    const rd = new FileReader();
    rd.onload = () => { formFile = {name:f.name, size:f.size, b64:String(rd.result).split(",")[1]}; $("fBox").innerHTML = `<b>${esc(f.name)}</b> · ${(f.size/1024).toFixed(0)} KB — แตะเพื่อเปลี่ยน`; $("fLink").value = ""; $("formMsg").textContent = ""; };
    rd.readAsDataURL(f);
  };
}
function readManForm(){
  const old = editIdx == null ? null : mdraft[editIdx];
  const roles = [$("fP").checked && "partner", $("fR").checked && "rsm"].filter(Boolean);
  let link = $("fLink").value.trim();
  const m = {title_th:$("fTTh").value.trim(), title_en:$("fTEn").value.trim(), module:$("fMod").value, roles, added: old ? old.added : new Date().toISOString().slice(0,10)};
  if (!m.title_th && !m.title_en) return "ใส่ชื่อคู่มือก่อน";
  if (!roles.length) return "เลือกอย่างน้อย 1 กลุ่มที่เห็นคู่มือนี้";
  if (link){ if (!/^https?:\/\//i.test(link)) link = "https://" + link; m.src = link; m.kind = kindOf(link); if (old && old.src && !/^https?:/i.test(old.src)) pendingDel.push(old.src); }
  else if (formFile){ m._file = formFile; m.kind = kindOf(formFile.name); m.src = old ? old.src : ""; m.added = new Date().toISOString().slice(0,10); }
  else if (old && old.src){ m.src = old.src; m.kind = old.kind; if (old._file) m._file = old._file; }
  else return "เลือกไฟล์ หรือใส่ลิงก์";
  return m;
}
function readForm(){
  const roles = [$("fPartner").checked && "partner", $("fRsm").checked && "rsm"].filter(Boolean);
  const m = { name_th:$("fNameTh").value.trim(), name_en:$("fNameEn").value.trim(), desc_th:$("fDescTh").value.trim(), desc_en:$("fDescEn").value.trim(),
              url:$("fUrl").value.trim(), icon:(panel.querySelector("#fIcons .on") || {}).dataset?.ic || "link", roles };
  if (!m.name_th && !m.name_en) return "ใส่ชื่อเมนูก่อน";
  if (!roles.length) return "เลือกอย่างน้อย 1 กลุ่มที่เห็นเมนูนี้";
  if (m.url && !/^https?:\/\//i.test(m.url)) m.url = "https://" + m.url;
  return m;
}
function ghCfg(){ let c = {}; try { c = JSON.parse(localStorage.getItem("afsGh") || "{}"); } catch(e){} c = {...GH_DEFAULT, ...c}; if (c.repo === "GWM-AFS-HUB") c.repo = GH_DEFAULT.repo; return c; }
function saveGhCfg(){ const c = {...ghCfg(), owner:$("ghOwner").value.trim(), repo:$("ghRepo").value.trim(), token:$("ghTok").value.trim()}; try { localStorage.setItem("afsGh", JSON.stringify(c)); } catch(e){} return c; }
const jsonText = () => JSON.stringify({ updated: new Date().toISOString(), modules: draft }, null, 2) + "\n";
const manJsonText = () => JSON.stringify({ updated: new Date().toISOString(), manuals: mdraft.map(({_file, ...m}) => m) }, null, 2) + "\n";
const b64utf8 = s => btoa(unescape(encodeURIComponent(s)));
function ghApi(c, path){ return { api:`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`, H:{ "Authorization":"Bearer " + c.token, "Accept":"application/vnd.github+json" } }; }
async function ghSha(c, path){
  const {api, H} = ghApi(c, path);
  const g = await fetch(`${api}?ref=${c.branch}`, {headers:H, cache:"no-store"});
  if (g.ok) return (await g.json()).sha;
  if (g.status === 401) throw new Error("token ใช้ไม่ได้ หรือหมดอายุ");
  if (g.status !== 404) throw new Error("GitHub ตอบกลับ " + g.status);
  return undefined;
}
async function ghPut(c, path, b64, message){
  const {api, H} = ghApi(c, path); const sha = await ghSha(c, path);
  const p = await fetch(api, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body: JSON.stringify({message, content:b64, branch:c.branch, ...(sha ? {sha} : {})})});
  if (!p.ok){ const j = await p.json().catch(() => ({})); let m = j.message || ("GitHub ตอบกลับ " + p.status);
    if (/not accessible/i.test(m)) m = "token ยังไม่มีสิทธิ์เขียน repo นี้ (ต้องเลือก repo นี้ใน token และตั้ง Contents: Read and write)";
    else if (/not found/i.test(m)) m = "ไม่พบ repo — เช็คชื่อ repo ในกล่องตั้งค่า";
    throw new Error(m); }
}
async function ghDel(c, path){
  try { const sha = await ghSha(c, path); if (!sha) return; const {api, H} = ghApi(c, path);
    await fetch(api, {method:"DELETE", headers:{...H, "Content-Type":"application/json"}, body: JSON.stringify({message:"Remove manual file", sha, branch:c.branch})}); } catch(e){}
}
const slugify = s => String(s || "").normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").toLowerCase().slice(0, 30);
async function saveToGitHub(){
  const c = saveGhCfg(), msg = $("saveMsg");
  if (!c.token){ msg.className = "msg bad"; msg.textContent = "ใส่ GitHub token ก่อน (ดูวิธีในกล่องตั้งค่า)"; panel.querySelector("details.gh").open = true; return; }
  msg.className = "msg";
  try {
    if (mtab === "menu"){
      msg.textContent = "กำลังบันทึก…";
      await ghPut(c, "modules.json", b64utf8(jsonText()), "Update hub menu");
      MODULES = draft.map(m => ({...m})); dirty = false; applyLang();
    } else {
      const ups = mdraft.filter(m => m._file); let n = 0;
      for (const m of ups){
        msg.textContent = `กำลังอัปโหลดไฟล์ ${++n}/${ups.length}: ${m._file.name}`;
        const ext = (m._file.name.split(".").pop() || "bin").toLowerCase();
        const stamp = new Date().toISOString().replace(/\D/g, "").slice(0, 12);
        const base = slugify(m.title_en) || slugify(m.module) || slugify(m._file.name.replace(/\.[^.]+$/, "")) || "manual";
        const path = `manuals/${base}-${stamp}.${ext}`;
        if (m.src && !/^https?:/i.test(m.src)) pendingDel.push(m.src);
        await ghPut(c, path, m._file.b64, `Add manual: ${m.title_th || m.title_en}`);
        m.src = path; delete m._file;
      }
      msg.textContent = "กำลังบันทึกรายการคู่มือ…";
      await ghPut(c, "manuals.json", b64utf8(manJsonText()), "Update manuals");
      for (const p of [...new Set(pendingDel)]) if (!mdraft.some(m => m.src === p)) await ghDel(c, p);
      pendingDel = [];
      MANUALS = normManuals(mdraft); dirty = false; applyLang(); drawList();
    }
    $("saveMsg").className = "msg ok"; $("saveMsg").textContent = "✓ บันทึกแล้ว — ทุกคนจะเห็นภายใน 1–2 นาที";
  } catch(e){ $("saveMsg").className = "msg bad"; $("saveMsg").textContent = "บันทึกไม่ได้: " + e.message; }
}
function downloadJson(){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([jsonText()], {type:"application/json"})); a.download = "modules.json";
  document.body.appendChild(a); a.click(); a.remove();
  MODULES = draft.map(m => ({...m})); applyLang();
  $("saveMsg").className = "msg"; $("saveMsg").textContent = "ดาวน์โหลดแล้ว — อัปโหลดไฟล์นี้ทับ modules.json ใน repo บน GitHub";
}
panel.addEventListener("click", e => {
  const ic = e.target.closest("[data-ic]");
  if (ic){ panel.querySelectorAll("#fIcons button").forEach(b => b.classList.toggle("on", b === ic)); return; }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const i = +b.dataset.i, a = b.dataset.a, L = mtab === "menu" ? draft : mdraft;
  if (a === "tab"){ if (b.dataset.t2 !== mtab){ mtab = b.dataset.t2; drawList(); } }
  else if (a === "up" || a === "down"){ const j = a === "up" ? i - 1 : i + 1; [L[i], L[j]] = [L[j], L[i]]; dirty = true; drawList(); }
  else if (a === "del"){ if (b.dataset.sure){ const [x] = L.splice(i, 1); if (mtab === "man" && x.src && !/^https?:/i.test(x.src)) pendingDel.push(x.src); dirty = true; drawList(); } else { b.dataset.sure = "1"; b.textContent = "ลบ?"; b.style.width = "auto"; b.style.padding = "0 8px"; b.style.color = "var(--red)"; } }
  else if (a === "edit") drawForm(i);
  else if (a === "add") drawForm(null);
  else if (a === "back") drawList();
  else if (a === "apply"){
    const m = mtab === "menu" ? readForm() : readManForm();
    if (typeof m === "string"){ $("formMsg").textContent = m; return; }
    if (editIdx == null) L.push(m); else L[editIdx] = m; dirty = true; drawList();
  }
  else if (a === "save") saveToGitHub();
  else if (a === "download") downloadJson();
  else if (a === "close") closeManager();
});
sheet.addEventListener("click", e => { if (e.target === sheet) closeManager(); });
$("manage").onclick = () => openManager("menu");
$("manManage").onclick = () => openManager("man");

/* ---------- events ---------- */
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
$("home").onclick = () => go("home");
$("back").onclick = () => go("home");
$("logout").onclick = () => { store.del("afsRsm"); go("home"); };
$("lang").onclick = e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; store.set("afsLang", lang); applyLang(); };
$("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("afsTheme", theme); applyTheme(); };
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeLock(); if ($("viewer").classList.contains("on")) closeViewer(); if (sheet.classList.contains("on")) closeManager(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1) || "home"; if (h !== view) go(h); });

applyTheme(); applyLang();
const h0 = location.hash.slice(1); if (h0 === "partner" || h0 === "rsm" || h0 === "manuals") go(h0);
loadModules().then(loadManuals);
</script>
